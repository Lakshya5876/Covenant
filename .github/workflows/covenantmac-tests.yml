name: covenantmac-tests

on:
  push:
    branches: [main]
    paths: ['CovenantMac/**', 'v1_release/**', '.github/workflows/covenantmac-tests.yml']
  pull_request:
    branches: [main]
    paths: ['CovenantMac/**', 'v1_release/**', '.github/workflows/covenantmac-tests.yml']

permissions:
  contents: read

jobs:
  covenant-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CovenantMac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run covenant.sh integration tests
        env:
          COVENANT_SKIP_STALENESS_CHECK: "1"
        run: chmod +x tests/covenant/run_tests.sh && ./tests/covenant/run_tests.sh
